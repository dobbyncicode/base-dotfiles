variables:
    # --- [ i ] - Apps ---
    terminal: "ghostty"
    browser: "brave"
    volume_control: "pavucontrol"
    file_manager: "{{@@ terminal @@}} -e yazi"
    editor: "nvim"
    code_editor: "{{@@ terminal @@}} -e {{@@ editor @@}}"
    screenshot: "grimblast copysave output"
    clipboard: "clipse"
    emoji_picker: "fuzzel -d emoji"
    screenrecord: "wf-recorder"
    file_manager_mime: "yazi"
    media_player: "mpv"
    pdf_viewer: "org.pwmt.zathura"

    # --- [ i ] - Editor information ---
    tab_space: "4"

    # --- [ i ] - System information ---
    interactive_shell: "fish"
    default_shell: "bash"
    root_repo: "{{@@ _dotdrop_cfgpath.rsplit('/', 1)[0] @@}}"

    # --- [ i ] - Theming ---
    cursor_theme: "Bibata-Modern-Ice"
    cursor_size: "24"
    icon_theme: "DeepenOS-Icons-Theme"

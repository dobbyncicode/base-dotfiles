# --- [ i ] - General auto-start ---
exec-once = syncthing

# --- [ i ] - Theming auto auto-start ---
exec-once = hyprctl setcursor {{@@ cursor_theme @@}} {{@@ cursor_size @@}}
exec-once = gsettings set org.gnome.desktop.interface cursor-theme {{@@ cursor_theme @@}}
exec-once = gsettings set org.gnome.desktop.interface cursor-size {{@@ cursor_size @@}}
exec-once = gsettings set org.gnome.desktop.interface icon-theme {{@@ icon_theme @@}}

exec-once = flatpak override --user --filesystem=~/.icons:ro
exec-once = flatpak override --user --filesystem=~/.local/share/icons:ro
exec-once = flatpak override --user --env=XCURSOR_THEME={{@@ cursor_theme @@}}
exec-once = flatpak override --user --env=XCURSOR_SIZE={{@@ cursor_size @@}}
exec-once = flatpak override --user --env=ICON_THEME={{@@ icon_theme @@}}
